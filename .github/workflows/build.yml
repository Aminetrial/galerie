name: Compiler l'APK et publier une Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compiler l'APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "Galerie-v1.0.${{ github.run_number }}.apk"

      - name: Publier dans les Releases GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Galerie v1.0.${{ github.run_number }}
          body: |
            APK de la galerie photo/vidéo.
            Téléchargez **Galerie-v1.0.${{ github.run_number }}.apk** ci-dessous et installez-le sur votre téléphone.
          files: Galerie-*.apk
